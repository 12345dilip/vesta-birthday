<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Vesta! 🎂</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="main-content">
            <h1 class="title">Happy Birthday Babe! 🎂😊</h1>

            <div class="message-section">
                <h2 class="greeting">Dear Vesta,</h2>

                <div class="poem-intro">
                    <p>Let's see...</p>
                </div>

                <div class="poem">
                    <p>You're always in my heart,</p>
                    <p>Your smile lights up my day.</p>
                    <p>Another year of beautiful moments,</p>
                    <p>Celebrating you in every way.</p>
                    <br>
                    <p>Will you make this day special?</p>
                    <p>'Cause you make my life magical!</p>
                </div>

                <div class="birthday-wish">
                    <h3>Happy Birthday, Beautiful! 🎉</h3>
                </div>

                <div class="signature">
                    <p>♥ Dilip</p>
                </div>
            </div>

            <div class="decorative-elements">
                <div class="heart heart1">💖</div>
                <div class="heart heart2">🎂</div>
                <div class="heart heart3">🎈</div>
                <div class="heart heart4">✨</div>
                <div class="heart heart5">🎁</div>
                <div class="heart heart6">🌟</div>
            </div>
        </div>
    </div>
</body>
</html>
